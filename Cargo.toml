[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lucas-rus/concord"
authors = ["Lucas-Michael Rus-Gheorghiu"]

[workspace.dependencies]
concord-core = { path = "crates/concord-core" }
concord-lang = { path = "crates/concord-lang" }
concord-git = { path = "crates/concord-git" }

tree-sitter = "0.27"
tree-sitter-python = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
