<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concord live</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --dim: #6b6b66; --line: #e3e3de;
  --work: #2f7dd1; --wait: #c98a12; --held: #d1495b; --fail: #b3123a; --done: #2e9a5b;
  --yields: #8a63d2; --combined: #2f9e9a; --handoff: #2f7dd1; --merge: #8b8b85; --negotiate: #c98a12; --together: #d1495b;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151514; --panel: #1e1e1c; --ink: #ecece8; --dim: #9a9a93; --line: #31312e;
    --work: #5aa2ee; --wait: #e2a93b; --held: #ee6b7c; --fail: #ff5577; --done: #4cc07f;
    --yields: #a988ee; --combined: #47c2bd; --handoff: #5aa2ee; --merge: #8f8f88; --negotiate: #e2a93b; --together: #ee6b7c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
header .run { font-family: var(--mono); font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
header .stat { font-family: var(--mono); font-size: 13px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid currentColor; }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; padding: 16px 20px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
#graph svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--dim); margin-top: 6px; }
.legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
.feed { font-family: var(--mono); font-size: 12px; max-height: 420px; overflow: auto; }
.feed div { padding: 2px 0; border-bottom: 1px dashed var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.feed .t, .t { color: var(--dim); margin-right: 8px; }
.warn { color: var(--held); }
#cards { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--work); border-radius: 10px; padding: 10px 12px; min-width: 0; transition: box-shadow .3s; }
.card.focus { box-shadow: 0 0 0 2px var(--work); }
.card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .name { font-weight: 650; font-family: var(--mono); }
.card .state { font-size: 12px; text-align: right; overflow-wrap: anywhere; }
.card .nums { font-family: var(--mono); font-size: 11px; color: var(--dim); margin: 4px 0 6px; }
.card ol { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 12px; }
.card li { padding: 2px 0; display: flex; gap: 8px; min-width: 0; }
.card li .w { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.card li.say .w { color: var(--dim); font-style: italic; white-space: normal; }
.card li:first-child .w { font-weight: 600; }
.k { flex: none; width: 1.3em; text-align: center; color: var(--dim); }
.tone-work { --c: var(--work); } .tone-wait { --c: var(--wait); } .tone-held { --c: var(--held); }
.tone-fail { --c: var(--fail); } .tone-done { --c: var(--done); }
.card[class*="tone-"] { border-left-color: var(--c); }
.state[class*="tone-"] { color: var(--c); }
.empty { color: var(--dim); font-style: italic; }
@keyframes dash { to { stroke-dashoffset: -16; } }
.waitedge { animation: dash 1s linear infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
</style>
</head>
<body>
<header>
  <h1>concord</h1>
  <span class="stat" id="clock">--:--</span>
  <span class="pill" id="status">connecting</span>
  <span class="stat" id="fin"></span>
  <span class="run" id="run"></span>
</header>
<main>
  <section id="graph"><h2>Agents and coordination <span style="text-transform:none;letter-spacing:0;font-weight:400">· click an agent to see its links</span></h2><svg id="svg" viewBox="0 0 640 460" role="img" aria-label="Coordination graph"></svg>
    <div class="legend" id="legend"></div></section>
  <section><h2>Coordination feed</h2><div class="feed" id="feed"><div class="empty">No coordination events yet.</div></div></section>
  <div id="cards"></div>
</main>
<script>
const KINDS = { "yields": "yields", "combined": "combined", "hand-off": "handoff", "merge": "merge", "negotiate": "negotiate", "fails together": "together" };
const ICON = { shell: "$", read: "◧", edit: "✎", search: "⌕", web: "⇣", plan: "☰", say: "“", other: "•" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mmss = t => { t = Math.max(0, Math.floor(t || 0)); return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
const ago = (now, ms) => mmss((now - ms) / 1000);
const css = n => getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim();
let focus = null;

document.getElementById("legend").innerHTML =
  [["waits for", "wait"], ...Object.entries(KINDS)].map(([label, v]) => `<span><i style="background:var(--${v})"></i>${label}</span>`).join("");

function graph(s) {
  const svg = document.getElementById("svg");
  const W = 640, H = 460, cx = W / 2, cy = H / 2 - 8, n = s.agents.length;
  const R = n <= 1 ? 0 : Math.min(175, 60 + n * 11);
  const pos = {};
  s.agents.forEach((a, i) => {
    const ang = -Math.PI / 2 + (2 * Math.PI * i) / Math.max(n, 1);
    pos[a.name] = [cx + R * Math.cos(ang), cy + R * Math.sin(ang)];
  });
  const r = n > 10 ? 16 : 20;
  // One line per pair of agents: thickness for how much they coordinated,
  // colour and arrow for the latest kind, brightness for how recent it was.
  const pairs = {};
  for (const e of s.edges) {
    if (!pos[e.from] || !pos[e.to]) continue;
    const key = [e.from, e.to].sort().join("\u0000");
    const p = pairs[key] ??= { total: 0, last: -1, items: [] };
    p.total += e.count; p.items.push(e);
    if (e.last >= p.last) { p.last = e.last; p.latest = e; }
  }
  const t = s.clock;
  const fresh = last => s.done ? 0.55 : Math.max(0.18, 1 - Math.max(0, t - last) / 300);
  const ends = (a, b, pad) => {
    const [x1, y1] = pos[a], [x2, y2] = pos[b];
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    return [x1 + dx / len * (r + 2), y1 + dy / len * (r + 2), x2 - dx / len * (r + pad), y2 - dy / len * (r + pad), dx / len, dy / len];
  };
  let out = `<defs>${["wait", ...Object.values(KINDS)].map(k =>
    `<marker id="m-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1L9,5L0,9z" fill="${css(k)}"/></marker>`).join("")}</defs>`;
  const touches = (p, name) => p.items.some(e => e.from === name || e.to === name);
  for (const p of Object.values(pairs).sort((a, b) => a.last - b.last)) {
    const e = p.latest, k = KINDS[e.kind] || "merge";
    const [sx, sy, ex, ey] = ends(e.from, e.to, 5);
    const op = focus ? (touches(p, focus) ? 0.95 : 0.06) : fresh(p.last);
    const tip = p.items.map(i => `${i.from} → ${i.to}: ${i.kind} ×${i.count}`).join("\n");
    out += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${css(k)}" stroke-width="${(1 + Math.log2(p.total + 1) * 1.2).toFixed(1)}" stroke-linecap="round" opacity="${op.toFixed(2)}" marker-end="url(#m-${k})"><title>${esc(tip)}</title></line>`;
  }
  for (const w of s.waits) {
    if (!pos[w.from] || !pos[w.to]) continue;
    const [sx, sy, ex, ey, ux, uy] = ends(w.from, w.to, 5);
    const ox = -uy * 6, oy = ux * 6;
    out += `<line class="waitedge" x1="${sx + ox}" y1="${sy + oy}" x2="${ex + ox}" y2="${ey + oy}" stroke="${css("wait")}" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m-wait)"><title>${esc(w.from)} waits for ${esc(w.to)} (${esc(w.why)})</title></line>`;
  }
  for (const a of s.agents) {
    const [x, y] = pos[a.name];
    const c = css(a.tone);
    const linked = Object.values(pairs).some(p => touches(p, focus) && touches(p, a.name));
    const op = focus && focus !== a.name && !linked ? 0.3 : 1;
    const live = a.tone === "work" && !s.done;
    const last = a.recent[0];
    const icon = a.tone === "done" ? "✓" : a.tone === "fail" ? "!" : ICON[last?.kind] || "…";
    const below = y >= cy - 1;
    const ly = below ? y + r + 15 : y - r - 8;
    out += `<g style="cursor:pointer" opacity="${op}" onclick="pick('${esc(a.name)}')">
      <circle cx="${x}" cy="${y}" r="${r}" fill="${css("panel")}" stroke="${c}" stroke-width="3.5" ${live ? 'class="pulse"' : ""}/>
      <text x="${x}" y="${y + 4.5}" text-anchor="middle" font-size="13" font-weight="700" style="font-family:var(--mono)" fill="${c}">${esc(icon)}</text>
      <text x="${x}" y="${ly}" text-anchor="middle" font-size="11.5" font-weight="600" fill="${css("ink")}" stroke="${css("panel")}" stroke-width="4" paint-order="stroke">${esc(a.name)}</text>
      <title>${esc(a.name)}: ${esc(a.state)}${last ? "\n" + esc(last.what) : ""}</title></g>`;
  }
  if (!n) out += `<text x="${cx}" y="${cy}" text-anchor="middle" fill="${css("dim")}">waiting for agents…</text>`;
  svg.innerHTML = out;
}

function cards(s) {
  const el = document.getElementById("cards");
  el.innerHTML = s.agents.map(a => {
    const nums = [["tools", a.tools], ["edits", a.edits], ["steps", a.steps], ["notices", a.notices], ["blocks", a.blocks],
      ["hand-offs", a.handoffs], ["combined", a.combined], ["merges", a.merges]].filter(([, v]) => v).map(([k, v]) => `${v} ${k}`).join(" · ");
    const items = a.recent.length ? a.recent.map(r =>
      `<li class="${r.kind}"><span class="t">${s.done && r.t != null ? mmss(r.t) : ago(s.now_ms, r.ms)}</span><span class="k">${ICON[r.kind] || "•"}</span><span class="w" title="${esc(r.what)}">${esc(r.what)}</span></li>`).join("")
      : `<li class="empty">no actions recorded yet</li>`;
    return `<div class="card tone-${a.tone}${focus === a.name ? " focus" : ""}" id="card-${esc(a.name)}" onclick="pick('${esc(a.name)}')">
      <div class="top"><span class="name">${esc(a.name)}</span><span class="state tone-${a.tone}">${esc(a.state)}</span></div>
      <div class="nums">${nums || "&nbsp;"}</div><ol>${items}</ol></div>`;
  }).join("");
}

function feed(s) {
  const rows = [...s.warnings.map(w => ({ ...w, warn: true })), ...s.feed]
    .filter((x, i, a) => a.findIndex(y => y.t === x.t && y.text === x.text) === i)
    .sort((a, b) => b.t - a.t);
  document.getElementById("feed").innerHTML = rows.length
    ? rows.map(r => `<div class="${r.warn ? "warn" : ""}"><span class="t">${mmss(r.t)}</span>${esc(r.text)}</div>`).join("")
    : `<div class="empty">No coordination events yet.</div>`;
}

let last = null;
function render(s) {
  last = s;
  document.getElementById("clock").textContent = mmss(s.clock);
  const st = document.getElementById("status");
  st.textContent = s.status;
  st.style.color = css(s.done ? "done" : s.status === "running" ? "work" : "held");
  document.getElementById("fin").textContent = `${s.finished}/${s.total} finished`;
  document.getElementById("run").textContent = s.title;
  document.title = `${s.finished}/${s.total} · Concord live`;
  graph(s); cards(s); feed(s);
}
function pick(name) {
  focus = focus === name ? null : name;
  if (last) render(last);
  if (focus) document.getElementById("card-" + focus)?.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
async function tick() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const s = await r.json();
    if (s.agents) render(s);
  } catch (e) {
    const st = document.getElementById("status");
    st.textContent = "viewer stopped"; st.style.color = css("held");
  }
  setTimeout(tick, 1000);
}
tick();
</script>
</body>
</html>
